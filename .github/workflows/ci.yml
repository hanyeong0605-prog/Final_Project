name: CI

on:
  pull_request:
    paths:
      - 'jobpilot-ai/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main, "김한영브뤤취학원"]
    paths:
      - 'jobpilot-ai/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      ai-server: ${{ steps.filter.outputs.ai-server }}
      wordcloud: ${{ steps.filter.outputs.wordcloud }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'jobpilot-ai/frontend/**'
            backend:
              - 'jobpilot-ai/backend/**'
            ai-server:
              - 'jobpilot-ai/ai-server/**'
            wordcloud:
              - 'jobpilot-ai/ml-project/**'

  frontend:
    name: Frontend build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobpilot-ai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jobpilot-ai/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobpilot-ai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode test

  ai-server:
    name: AI server syntax check
    needs: changes
    if: needs.changes.outputs.ai-server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobpilot-ai/ai-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python -m compileall -q app

  wordcloud-image:
    name: Wordcloud Docker build
    needs: changes
    if: needs.changes.outputs.wordcloud == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jobpilot-wordcloud-test ./jobpilot-ai/ml-project
