name: CI

on:
  pull_request:
    paths:
      - 'jobpilot-ai/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'jobpilot-ai/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobpilot-ai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jobpilot-ai/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobpilot-ai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode test

  ai-server:
    name: AI server syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobpilot-ai/ai-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python -m compileall -q app

  wordcloud-image:
    name: Wordcloud Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jobpilot-wordcloud-test ./jobpilot-ai/ml-project
