name: Verify and deploy main to EC2

on:
  push:
    # main에 푸시한 정확한 커밋을 EC2에서 직접 빌드·배포한다.
    branches: [main]
    paths:
      - 'jobpilot-ai/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      dart_backfill:
        description: 'Run one-shot OpenDART company matching and seven-year financial backfill'
        required: false
        default: false
        type: boolean
      company_growth_report:
        description: 'Build a temporary company-growth dataset and print held-out metrics'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deploy
  # 최신 main 커밋만 배포한다. 이전 대기/실행 배포가 뒤늦게 서버를 덮지 않게 한다.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'jobpilot-ai/frontend/**'
            backend:
              - 'jobpilot-ai/backend/**'
            ai-server:
              - 'jobpilot-ai/ai-server/**'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.frontend == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jobpilot-ai/frontend/package-lock.json
      - name: Build frontend
        if: steps.filter.outputs.frontend == 'true'
        working-directory: jobpilot-ai/frontend
        run: npm ci && npm run build
      - uses: actions/setup-java@v4
        if: steps.filter.outputs.backend == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: jobpilot-ai/backend/pom.xml
      - name: Test backend
        if: steps.filter.outputs.backend == 'true'
        working-directory: jobpilot-ai/backend
        run: mvn -B test
      - name: Build AI image and verify packaged sentiment model
        if: steps.filter.outputs.ai-server == 'true'
        working-directory: jobpilot-ai/ai-server
        run: |
          docker build -t jobpilot-ai-verify .
          docker run --rm jobpilot-ai-verify python -c "from app.domain.sentiment.service import get_sentiment_service; assert get_sentiment_service().status().state == 'READY'"

  deploy:
    name: Update EC2 containers
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy changed services over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REPO_READ_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          # CPU-only AI images can take several minutes on the small EC2 host.
          # The default drone-ssh command limit interrupts a healthy build.
          command_timeout: 30m
          envs: REPO_READ_TOKEN
          script: |
            set -eu

            cd /opt/jobpilot
            DEPLOY_BRANCH='${{ github.ref_name }}'
            CURRENT_COMMIT="$(git rev-parse HEAD)"
            AUTH_HEADER="$(printf 'x-access-token:%s' "$REPO_READ_TOKEN" | base64 -w 0)"
            GIT_TERMINAL_PROMPT=0 git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" fetch origin "$DEPLOY_BRANCH"
            TARGET_REF="origin/$DEPLOY_BRANCH"
            CHANGED_FILES="$(git diff --name-only "$CURRENT_COMMIT" "$TARGET_REF")"
            # Do not merge a feature branch into main on the server. The
            # currently pushed commit is checked out detached and is the exact
            # source Docker builds below, while the repository's main branch
            # remains untouched.
            git checkout --detach "$TARGET_REF"

            cd /opt/jobpilot/jobpilot-ai
            export ENV_FILE=/etc/jobpilot/jobpilot.env
            export DART_BACKFILL_ON_START='${{ inputs.dart_backfill || false }}'
            export DART_FINANCIAL_SYNC_ON_START='${{ inputs.dart_backfill || false }}'
            # This branch is the production deployment branch.  Keep Flyway
            # enabled so a backend release and its versioned DB migration are
            # always applied together before Hibernate validates the schema.
            export SPRING_FLYWAY_ENABLED=true
            COMPOSE="sudo -E docker compose --env-file /etc/jobpilot/jobpilot.env -f docker-compose.prod.yml"

            # Keep dependency layers; prune only under actual disk pressure.
            AVAILABLE_KB="$(df -Pk /var/lib/docker | awk 'END { print $4 }')"
            if [ "$AVAILABLE_KB" -lt 8388608 ]; then
              sudo docker builder prune --all --force
              sudo docker image prune --force
            fi

            # The backend workers call the sentiment API as soon as they start,
            # so make the compatible AI API ready before migrating/restarting
            # the backend. The queue still retries transient rollout failures.
            if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^jobpilot-ai/(ai-server/|docker-compose.prod.yml$)'; then
                $COMPOSE build ai-server
                $COMPOSE up -d --no-deps ai-server
                AI_HEALTHY=false
                for attempt in $(seq 1 24); do
                  AI_CONTAINER="$($COMPOSE ps -q ai-server)"
                  if [ -n "$AI_CONTAINER" ] && \
                    [ "$(sudo docker inspect --format '{{.State.Health.Status}}' "$AI_CONTAINER")" = "healthy" ]; then
                    AI_HEALTHY=true
                    break
                  fi
                  sleep 5
                done
                if [ "$AI_HEALTHY" != 'true' ]; then
                  $COMPOSE logs --tail=120 ai-server
                  echo "AI server did not become healthy within 120 seconds." >&2
                  exit 1
                fi
            fi

            if [ '${{ inputs.dart_backfill || false }}' = 'true' ] || \
              printf '%s\n' "$CHANGED_FILES" | grep -Eq '^jobpilot-ai/(backend/|docker-compose.prod.yml$)'; then
                $COMPOSE build backend
                if [ '${{ inputs.dart_backfill || false }}' = 'true' ]; then
                  $COMPOSE up -d --no-deps --force-recreate backend
                else
                  $COMPOSE up -d --no-deps backend
                fi
            fi

            if printf '%s\n' "$CHANGED_FILES" | grep -q '^jobpilot-ai/frontend/'; then
                $COMPOSE build frontend
                $COMPOSE up -d --no-deps frontend
            fi

            # Wordcloud is independent and is only rebuilt for its own source.

            if printf '%s\n' "$CHANGED_FILES" | grep -q '^jobpilot-ai/ml-project/'; then
                $COMPOSE build wordcloud-server
                $COMPOSE up -d --no-deps wordcloud-server
            fi

            $COMPOSE ps
            # Check the backend container's own Compose health check. Going
            # through host Nginx here is not reliable: the host proxy may be
            # independently reconfigured for TLS and return a 404 even while
            # the backend is healthy.
            BACKEND_HEALTHY=false
            for attempt in $(seq 1 240); do
              BACKEND_CONTAINER="$($COMPOSE ps -q backend)"
              if [ -n "$BACKEND_CONTAINER" ] && \
                [ "$(sudo docker inspect --format '{{.State.Health.Status}}' "$BACKEND_CONTAINER")" = "healthy" ]; then
                BACKEND_HEALTHY=true
                break
              fi
              sleep 5
            done

            if [ "$BACKEND_HEALTHY" != 'true' ]; then
              $COMPOSE ps
              $COMPOSE logs --tail=120 backend
              echo "Backend did not become healthy within 1200 seconds." >&2
              exit 1
            fi

            if [ '${{ inputs.dart_backfill || false }}' = 'true' ]; then
              DART_SYNC_COMPLETE=false
              for attempt in $(seq 1 240); do
                if $COMPOSE logs --since=30m backend | grep -q 'DART financial sync complete'; then
                  DART_SYNC_COMPLETE=true
                  break
                fi
                sleep 5
              done
              if [ "$DART_SYNC_COMPLETE" != 'true' ]; then
                $COMPOSE logs --tail=200 backend
                echo "DART financial sync did not complete within 1200 seconds." >&2
                exit 1
              fi
              $COMPOSE logs --since=30m backend | grep -E 'DART backfill complete|DART financial sync complete'
            fi

            if [ '${{ inputs.company_growth_report || false }}' = 'true' ]; then
              AI_CONTAINER="$($COMPOSE ps -q ai-server)"
              REPORT_ID='${{ github.run_id }}'
              DATASET="/tmp/company-years-$REPORT_ID.csv"
              ARTIFACT="/tmp/company-growth-$REPORT_ID"
              sudo docker exec "$AI_CONTAINER" python -m ml.company_finance_dataset --output "$DATASET"
              sudo docker exec "$AI_CONTAINER" python -c "import pandas as pd; d=pd.read_csv('$DATASET'); print('COMPANY_GROWTH_DATASET_ROWS='+str(len(d))); print('COMPANIES='+str(d.corp_code.nunique())); print('BASE_YEAR_COUNTS'); print(d.groupby('base_year').size().to_string()); print('LABEL_RATES'); print(d[['next_revenue_positive','next_profitability_improved','next_stability_risk']].mean().to_string()); print('SAMPLE_ROWS'); print(d.head(10).to_string(index=False))"
              sudo docker exec "$AI_CONTAINER" python -m ml.train_company_growth_model --dataset "$DATASET" --cutoff-year 2023 --output "$ARTIFACT"
            fi
