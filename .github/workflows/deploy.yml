name: Verify and deploy main to EC2

on:
  push:
    # main에 푸시한 정확한 커밋을 EC2에서 직접 빌드·배포한다.
    branches: [main]
    paths:
      - 'jobpilot-ai/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      dart_backfill:
        description: 'Run one-shot OpenDART company matching and seven-year financial backfill'
        required: false
        default: false
        type: boolean
      company_growth_report:
        description: 'Build a temporary company-growth dataset and print held-out metrics'
        required: false
        default: false
        type: boolean
      company_growth_publish:
        description: 'Train, validate, publish the company-growth model, then generate production predictions'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deploy
  # 최신 main 커밋만 배포한다. 이전 대기/실행 배포가 뒤늦게 서버를 덮지 않게 한다.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'jobpilot-ai/frontend/**'
            backend:
              - 'jobpilot-ai/backend/**'
            ai-server:
              - 'jobpilot-ai/ai-server/**'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.frontend == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jobpilot-ai/frontend/package-lock.json
      - name: Build frontend
        if: steps.filter.outputs.frontend == 'true'
        working-directory: jobpilot-ai/frontend
        run: npm ci && npm run build
      - uses: actions/setup-java@v4
        if: steps.filter.outputs.backend == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: jobpilot-ai/backend/pom.xml
      - name: Test backend
        if: steps.filter.outputs.backend == 'true'
        working-directory: jobpilot-ai/backend
        run: mvn -B test
      - name: Build AI image and verify packaged sentiment model
        if: steps.filter.outputs.ai-server == 'true'
        working-directory: jobpilot-ai/ai-server
        run: |
          docker build -t jobpilot-ai-verify .
          docker run --rm jobpilot-ai-verify python -c "from app.domain.sentiment.service import get_sentiment_service; assert get_sentiment_service().status().state == 'READY'"

  deploy:
    name: Update EC2 containers
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy changed services over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REPO_READ_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          # CPU-only AI images can take several minutes on the small EC2 host.
          # The default drone-ssh command limit interrupts a healthy build.
          # A first full-company financial recovery can involve 500+ corporations
          # across seven fiscal years. Leave enough time for DART's rate limits.
          command_timeout: 70m
          envs: REPO_READ_TOKEN
          script: |
            set -eu

            cd /opt/jobpilot
            DEPLOY_BRANCH='${{ github.ref_name }}'
            CURRENT_COMMIT="$(git rev-parse HEAD)"
            AUTH_HEADER="$(printf 'x-access-token:%s' "$REPO_READ_TOKEN" | base64 -w 0)"
            GIT_TERMINAL_PROMPT=0 git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" fetch origin "$DEPLOY_BRANCH"
            TARGET_REF="origin/$DEPLOY_BRANCH"
            CHANGED_FILES="$(git diff --name-only "$CURRENT_COMMIT" "$TARGET_REF")"
            # Do not merge a feature branch into main on the server. The
            # currently pushed commit is checked out detached and is the exact
            # source Docker builds below, while the repository's main branch
            # remains untouched.
            git checkout --detach "$TARGET_REF"

            cd /opt/jobpilot/jobpilot-ai
            export ENV_FILE=/etc/jobpilot/jobpilot.env
            export DART_BACKFILL_ON_START='${{ inputs.dart_backfill || false }}'
            export DART_FINANCIAL_SYNC_ON_START='${{ inputs.dart_backfill || false }}'
            # Predictions are deliberately opt-in: a model is promoted only after the
            # training command exits successfully with validated=true metadata.
            export DART_PREDICTION_SYNC_ON_START='${{ inputs.company_growth_publish || false }}'
            # This branch is the production deployment branch.  Keep Flyway
            # enabled so a backend release and its versioned DB migration are
            # always applied together before Hibernate validates the schema.
            export SPRING_FLYWAY_ENABLED=true
            COMPOSE="sudo -E docker compose --env-file /etc/jobpilot/jobpilot.env -f docker-compose.prod.yml"

            # Keep dependency layers; prune only under actual disk pressure.
            AVAILABLE_KB="$(df -Pk /var/lib/docker | awk 'END { print $4 }')"
            if [ "$AVAILABLE_KB" -lt 8388608 ]; then
              sudo docker builder prune --all --force
              sudo docker image prune --force
            fi

            # The backend workers call the sentiment API as soon as they start,
            # so make the compatible AI API ready before migrating/restarting
            # the backend. The queue still retries transient rollout failures.
            if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^jobpilot-ai/(ai-server/|docker-compose.prod.yml$)'; then
                $COMPOSE build ai-server
                $COMPOSE up -d --no-deps ai-server
                AI_HEALTHY=false
                for attempt in $(seq 1 24); do
                  AI_CONTAINER="$($COMPOSE ps -q ai-server)"
                  if [ -n "$AI_CONTAINER" ] && \
                    [ "$(sudo docker inspect --format '{{.State.Health.Status}}' "$AI_CONTAINER")" = "healthy" ]; then
                    AI_HEALTHY=true
                    break
                  fi
                  sleep 5
                done
                if [ "$AI_HEALTHY" != 'true' ]; then
                  $COMPOSE logs --tail=120 ai-server
                  echo "AI server did not become healthy within 120 seconds." >&2
                  exit 1
                fi
            fi

            if [ '${{ inputs.dart_backfill || false }}' = 'true' ] || \
              [ '${{ inputs.company_growth_publish || false }}' = 'true' ] || \
              printf '%s\n' "$CHANGED_FILES" | grep -Eq '^jobpilot-ai/(backend/|docker-compose.prod.yml$)'; then
                # A manual finance recovery must execute the exact source just
                # checked out above. Docker's cached Maven package layer can
                # otherwise retain a previous backend JAR even though Git is at
                # a newer main commit, hiding diagnostics and fixes.
                if [ '${{ inputs.dart_backfill || false }}' = 'true' ]; then
                  $COMPOSE build --no-cache backend
                else
                  $COMPOSE build backend
                fi
                if [ '${{ inputs.dart_backfill || false }}' = 'true' ] || [ '${{ inputs.company_growth_publish || false }}' = 'true' ]; then
                  $COMPOSE up -d --no-deps --force-recreate backend
                else
                  $COMPOSE up -d --no-deps backend
                fi
            fi

            if printf '%s\n' "$CHANGED_FILES" | grep -q '^jobpilot-ai/frontend/'; then
                $COMPOSE build frontend
                $COMPOSE up -d --no-deps frontend
            fi

            # Wordcloud is independent and is only rebuilt for its own source.

            if printf '%s\n' "$CHANGED_FILES" | grep -q '^jobpilot-ai/ml-project/'; then
                $COMPOSE build wordcloud-server
                $COMPOSE up -d --no-deps wordcloud-server
            fi

            $COMPOSE ps
            # Check the backend container's own Compose health check. Going
            # through host Nginx here is not reliable: the host proxy may be
            # independently reconfigured for TLS and return a 404 even while
            # the backend is healthy.
            BACKEND_HEALTHY=false
            for attempt in $(seq 1 240); do
              BACKEND_CONTAINER="$($COMPOSE ps -q backend)"
              if [ -n "$BACKEND_CONTAINER" ] && \
                [ "$(sudo docker inspect --format '{{.State.Health.Status}}' "$BACKEND_CONTAINER")" = "healthy" ]; then
                BACKEND_HEALTHY=true
                break
              fi
              sleep 5
            done

            if [ "$BACKEND_HEALTHY" != 'true' ]; then
              $COMPOSE ps
              $COMPOSE logs --tail=120 backend
              echo "Backend did not become healthy within 1200 seconds." >&2
              exit 1
            fi

            if [ '${{ inputs.dart_backfill || false }}' = 'true' ]; then
              FINANCE_SYNC_COMPLETE=false
              for attempt in $(seq 1 840); do
                # The DART log is emitted before the public-data fallback starts. A temporary
                # DART quota pause is also terminal for DART but does not prevent the public
                # fallback from filling years for previously confirmed corporations.
                # Do not train/recreate the backend yet: doing so interrupts the
                # fallback midway and leaves the prediction pool artificially small.
                if ($COMPOSE logs --since=70m backend | grep -q 'DART financial sync complete' || \
                    $COMPOSE logs --since=70m backend | grep -q 'DART financial sync paused') && \
                  $COMPOSE logs --since=70m backend | grep -q 'Public finance fallback sync complete'; then
                  FINANCE_SYNC_COMPLETE=true
                  break
                fi
                sleep 5
              done
              if [ "$FINANCE_SYNC_COMPLETE" != 'true' ]; then
                $COMPOSE logs --tail=300 backend
                echo "DART/public financial sync did not complete within 4200 seconds." >&2
                exit 1
              fi
              $COMPOSE logs --since=70m backend | grep -E 'DART backfill complete|DART financial sync complete|DART financial sync paused|Public finance fallback diagnostics|Public finance fallback sync complete'
            fi

            if [ '${{ inputs.company_growth_report || false }}' = 'true' ] || [ '${{ inputs.company_growth_publish || false }}' = 'true' ]; then
              AI_CONTAINER="$($COMPOSE ps -q ai-server)"
              REPORT_ID='${{ github.run_id }}'
              DATASET="/tmp/company-years-$REPORT_ID.csv"
              ARTIFACT="/tmp/company-growth-$REPORT_ID"
              sudo docker exec "$AI_CONTAINER" python -m ml.company_finance_dataset --output "$DATASET"
              sudo docker exec "$AI_CONTAINER" python -c "import pandas as pd; d=pd.read_csv('$DATASET'); print('COMPANY_GROWTH_DATASET_ROWS='+str(len(d))); print('COMPANIES='+str(d.corp_code.nunique())); print('BASE_YEAR_COUNTS'); print(d.groupby('base_year').size().to_string()); print('LABEL_RATES'); print(d[['next_revenue_positive','next_profitability_improved','next_stability_risk']].mean().to_string()); print('SAMPLE_ROWS'); print(d.head(10).to_string(index=False))"
              # Train on 2021-2023 and reserve the latest complete base year (2024)
              # as a strictly future holdout. This keeps more history in the small dataset.
              sudo docker exec "$AI_CONTAINER" python -m ml.train_company_growth_model --dataset "$DATASET" --cutoff-year 2024 --output "$ARTIFACT"

              if [ '${{ inputs.company_growth_publish || false }}' = 'true' ]; then
                # The artifact is first created in /tmp. A failed training command
                # stops the script before this point, so an unvalidated model cannot
                # replace the currently mounted production artifact.
                # Training writes metadata even when evaluation fails. Promotion
                # must fail closed before touching the mounted production model.
                sudo docker exec "$AI_CONTAINER" python -c "import json; assert json.load(open('$ARTIFACT/metadata.json', encoding='utf-8'))['validated'] is True, 'held-out validation did not pass'"
                MODEL_DIR="$(sudo docker inspect --format '{{range .Mounts}}{{if eq .Destination "/models/company-growth"}}{{.Source}}{{end}}{{end}}' "$AI_CONTAINER")"
                if [ -z "$MODEL_DIR" ]; then
                  echo 'Unable to resolve the host model volume.' >&2
                  exit 1
                fi
                STAGING_DIR="${MODEL_DIR}.staging-$REPORT_ID"
                BACKUP_DIR="${MODEL_DIR}.previous-$REPORT_ID"
                sudo install -d -m 0755 "$STAGING_DIR"
                sudo docker cp "$AI_CONTAINER:$ARTIFACT/." "$STAGING_DIR"
                sudo test -s "$STAGING_DIR/model.joblib"
                sudo test -s "$STAGING_DIR/metadata.json"
                sudo mv "$MODEL_DIR" "$BACKUP_DIR"
                sudo mv "$STAGING_DIR" "$MODEL_DIR"

                # Reload the read-only model volume before asking Spring to persist
                # predictions. The AI service refuses artifacts without validated=true.
                $COMPOSE up -d --no-deps --force-recreate ai-server
                AI_READY=false
                for attempt in $(seq 1 24); do
                  AI_CONTAINER="$($COMPOSE ps -q ai-server)"
                  if [ -n "$AI_CONTAINER" ] && \
                    sudo docker exec "$AI_CONTAINER" python -c "import json,urllib.request; s=json.load(urllib.request.urlopen('http://localhost:8001/company-finance/health'))['state']; assert s == 'READY', s"; then
                    AI_READY=true
                    break
                  fi
                  sleep 5
                done
                if [ "$AI_READY" != 'true' ]; then
                  echo 'Published model did not become READY; previous artifact is retained at:' "$BACKUP_DIR" >&2
                  exit 1
                fi
                # The earlier backend restart may have happened before the model
                # promotion. Recreate it now so the one-shot prediction runner
                # calls the READY AI service and persists fresh results.
                $COMPOSE up -d --no-deps --force-recreate backend
                PREDICTION_SYNC_COMPLETE=false
                for attempt in $(seq 1 120); do
                  if $COMPOSE logs --since=10m backend | grep -q 'DART validated growth prediction sync complete'; then
                    PREDICTION_SYNC_COMPLETE=true
                    break
                  fi
                  sleep 5
                done
                if [ "$PREDICTION_SYNC_COMPLETE" != 'true' ]; then
                  $COMPOSE logs --tail=200 backend
                  echo 'Company growth prediction sync did not complete within 600 seconds.' >&2
                  exit 1
                fi
                $COMPOSE logs --since=10m backend | grep 'DART validated growth prediction sync complete'
                echo "COMPANY_GROWTH_MODEL_PUBLISHED=$MODEL_DIR"
              fi
            fi
