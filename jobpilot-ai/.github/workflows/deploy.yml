name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test backend
        working-directory: backend
        run: mvn -B test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -eu
            cd ~/Final_Project/jobpilot-ai 2>/dev/null || cd ~/Final_Project
            git fetch https://x-access-token:${{ secrets.REPO_READ_TOKEN }}@github.com/${{ github.repository }}.git main
            git merge --ff-only FETCH_HEAD
            sudo ENV_FILE=/etc/jobpilot/jobpilot.env docker compose --env-file /etc/jobpilot/jobpilot.env -f docker-compose.prod.yml up -d --build
            curl --fail --retry 12 --retry-delay 5 http://localhost/api/v1/health
