services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY:?Set VITE_KAKAO_MAP_KEY in the server environment file}
        VITE_ML_API_URL: ${VITE_ML_API_URL:-/wordcloud-api}
        VITE_TOSS_CLIENT_KEY: ${VITE_TOSS_CLIENT_KEY:?Set VITE_TOSS_CLIENT_KEY in the server environment file}
        VITE_TURN_URL: ${VITE_TURN_URL:-}
        VITE_TURN_USERNAME: ${VITE_TURN_USERNAME:-}
        VITE_TURN_CREDENTIAL: ${VITE_TURN_CREDENTIAL:-}
    restart: unless-stopped
    ports:
      # TLS terminates at the host Nginx. Keep the application container
      # reachable only from this EC2 instance.
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
      ai-server:
        condition: service_healthy
      wordcloud-server:
        condition: service_healthy

  # Optional WebRTC relay for the phone camera. Direct STUN connections work
  # on many networks, but a TURN relay is required when phone data / carrier
  # NAT blocks peer-to-peer media. Start with `--profile turn` after setting
  # the TURN_* and VITE_TURN_* entries in /etc/jobpilot/jobpilot.env.
  turn:
    image: coturn/coturn:4.6.2
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:-job-a-dream.site}
      - --user=${TURN_USERNAME:?Set TURN_USERNAME in the server environment file}:${TURN_PASSWORD:?Set TURN_PASSWORD in the server environment file}
      - --external-ip=${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP to the EC2 public IP in the server environment file}
      - --min-port=49160
      - --max-port=49200
      - --no-multicast-peers

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:?Set ENV_FILE to the absolute path of the server environment file}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Feature-branch deployments share the production database. The deploy
      # workflow disables Flyway for those runs; main remains the only branch
      # that validates and applies schema migrations.
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      SERVER_PORT: 9000
      AI_SERVER_BASE_URL: http://ai-server:8001
      FACE_VERIFICATION_BASE_URL: http://wordcloud-server:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY_BACKEND:-}
      ADMIN_FACE_REFERENCE_DIR: /app/admin_photos
    volumes:
      - ${ADMIN_FACE_PHOTOS_DIR:-/srv/jobpilot/admin-face-photos}:/app/admin_photos
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/v1/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  ai-server:
    build:
      context: ./ai-server
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:?Set ENV_FILE to the absolute path of the server environment file}
    environment:
      BACKEND_BASE_URL: http://backend:9000
      GEMINI_API_KEY: ${GEMINI_API_KEY_AI:-}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  wordcloud-server:
    build:
      context: ./ml-project
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:?Set ENV_FILE to the absolute path of the server environment file}
    environment:
      FACE_REFERENCE_DIR: /app/admin_photos
      WORDCLOUD_MASK_IMAGE: /assets/mascot-fullbody-wordcloud.png
      WORDCLOUD_CACHE_REFRESH_ENABLED: ${WORDCLOUD_CACHE_REFRESH_ENABLED:-true}
      WORDCLOUD_CACHE_REFRESH_ON_START: ${WORDCLOUD_CACHE_REFRESH_ON_START:-true}
      WORDCLOUD_CACHE_REFRESH_INTERVAL_MINUTES: ${WORDCLOUD_CACHE_REFRESH_INTERVAL_MINUTES:-180}
    expose:
      - "8000"
    volumes:
      # Keep biometric reference images outside the image and Git. Set the
      # absolute host directory in the production environment file.
      - ${ADMIN_FACE_PHOTOS_DIR:-/srv/jobpilot/admin-face-photos}:/app/admin_photos:ro
      # Keep computed TF-IDF scores and the three pre-rendered PNGs across container restarts.
      - ${WORDCLOUD_CACHE_DIR:-/srv/jobpilot/wordcloud-cache}:/app/runtime-cache
      # The cat-shaped word-cloud mask is an application asset, not generated data.
      - ./frontend/public/mascot/mascot-fullbody-wordcloud.png:/assets/mascot-fullbody-wordcloud.png:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
