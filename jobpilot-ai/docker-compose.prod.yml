services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY:?Set VITE_KAKAO_MAP_KEY in the server environment file}
        VITE_ML_API_URL: ${VITE_ML_API_URL:-/wordcloud-api}
        VITE_TOSS_CLIENT_KEY: ${VITE_TOSS_CLIENT_KEY:?Set VITE_TOSS_CLIENT_KEY in the server environment file}
    restart: unless-stopped
    ports:
      # TLS terminates at the host Nginx. Keep the application container
      # reachable only from this EC2 instance.
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
      ai-server:
        condition: service_healthy
      wordcloud-server:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:?Set ENV_FILE to the absolute path of the server environment file}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 9000
      AI_SERVER_BASE_URL: http://ai-server:8001
      FACE_VERIFICATION_BASE_URL: http://wordcloud-server:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY_BACKEND:-}
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/v1/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  ai-server:
    build:
      context: ./ai-server
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:?Set ENV_FILE to the absolute path of the server environment file}
    environment:
      BACKEND_BASE_URL: http://backend:9000
      GEMINI_API_KEY: ${GEMINI_API_KEY_AI:-}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  wordcloud-server:
    build:
      context: ./ml-project
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:?Set ENV_FILE to the absolute path of the server environment file}
    environment:
      FACE_REFERENCE_DIR: /app/admin_photos
      WORDCLOUD_CACHE_REFRESH_ENABLED: ${WORDCLOUD_CACHE_REFRESH_ENABLED:-true}
      WORDCLOUD_CACHE_REFRESH_ON_START: ${WORDCLOUD_CACHE_REFRESH_ON_START:-true}
      WORDCLOUD_CACHE_REFRESH_INTERVAL_MINUTES: ${WORDCLOUD_CACHE_REFRESH_INTERVAL_MINUTES:-360}
    expose:
      - "8000"
    volumes:
      # Keep biometric reference images outside the image and Git. Set the
      # absolute host directory in the production environment file.
      - ${ADMIN_FACE_PHOTOS_DIR:-/srv/jobpilot/admin-face-photos}:/app/admin_photos:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
