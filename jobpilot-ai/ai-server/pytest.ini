; ai-server 폴더에서 그냥 `pytest`를 치면 tests/만 돌게 한다.
;
; 2026-09-02: 이게 없으면 pytest가 ml/의 수동 확인용 스크립트(ml/test_field_questions.py,
; ml/test_field_questions_validated.py)까지 이름만 보고 테스트로 끌어모은다. 둘 다 import
; 시점에 바로 실행되는 스크립트라서, 실제로 (1) 이미 삭제된 LoRA 함수(generate_question)를
; import하다 ImportError가 나고, 그 한 건 때문에 수집 단계에서 전체 스위트가 중단됐고
; (2) 다른 하나는 수집만 돼도 Gemini를 실제로 호출한다. 테스트가 아니라 스크립트이므로
; 수집 대상에서 빼는 게 맞다(파일 이름의 test_ 접두사는 "돌려서 확인해보는 것"이라는
; 뜻으로 붙은 것이지 pytest용이 아니다).
[pytest]
testpaths = tests
