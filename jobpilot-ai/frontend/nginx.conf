server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolve service names when requests arrive so
    # Nginx can start even while Compose is still attaching peer containers.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /api/ {
        set $backend_upstream backend:9000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Strip /ai-api before forwarding: /ai-api/interview/... -> /interview/...
    location /ai-api/ {
        set $ai_server_upstream ai-server:8001;
        rewrite ^/ai-api/(.*)$ /$1 break;
        proxy_pass http://$ai_server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebRTC uses this WebSocket only to exchange offer/answer/ICE messages.
    # The actual camera and microphone stream is sent peer-to-peer.
    location /ws/ {
        set $backend_upstream backend:9000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
