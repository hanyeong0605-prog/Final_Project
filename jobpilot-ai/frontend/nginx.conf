server {
    listen 80;
    server_name _;
    # 2026-08-13: iOS Safari는 WebKit 무음 녹음 버그를 피하려고 오디오만이 아니라 영상까지
    # 같이 녹음해서 올린다(MockInterviewPage.tsx beginActualRecording 참고) - 답변이 길어지면
    # 예전 25m로는 부족할 수 있어 여유를 뒀다.
    client_max_body_size 60m;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolve service names when requests arrive so
    # Nginx can start even while Compose is still attaching peer containers.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /api/ {
        set $backend_upstream backend:9000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Spring Security owns the OAuth authorization start and provider callback routes.
    location /oauth2/ {
        set $backend_upstream backend:9000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep the HTTPS scheme supplied by the host Nginx so Spring generates
        # the exact https callback URI registered with each OAuth provider.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /login/oauth2/ {
        set $backend_upstream backend:9000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Strip /ai-api before forwarding: /ai-api/interview/... -> /interview/...
    location /ai-api/ {
        set $ai_server_upstream ai-server:8001;
        rewrite ^/ai-api/(.*)$ /$1 break;
        proxy_pass http://$ai_server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /wordcloud-api/ {
        set $wordcloud_upstream wordcloud-server:8000;
        rewrite ^/wordcloud-api/(.*)$ /$1 break;
        proxy_pass http://$wordcloud_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebRTC uses this WebSocket only to exchange offer/answer/ICE messages.
    # The actual camera and microphone stream is sent peer-to-peer.
    location /ws/ {
        set $backend_upstream backend:9000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
