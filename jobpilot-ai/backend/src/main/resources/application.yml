spring:
  config:
    import: optional:file:../.env[.properties]
  profiles:
    default: local
  application:
    name: jobpilot-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jobpilot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID:disabled-google}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:disabled-google}
            scope: openid, profile, email
          kakao:
            client-id: ${OAUTH_KAKAO_REST_API_KEY:disabled-kakao}
            client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:disabled-kakao}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # 현재 카카오 앱의 이메일 권한이 승인되지 않아도 로그인 자체는 가능해야 한다.
            # 이메일 권한을 승인받은 뒤에만 account_email을 이 목록에 추가한다.
            scope: profile_nickname
          naver:
            client-id: ${OAUTH_NAVER_CLIENT_ID:disabled-naver}
            client-secret: ${OAUTH_NAVER_CLIENT_SECRET:disabled-naver}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: nickname, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

dart:
  # OpenDART key is supplied only through the backend container environment.
  api-key: ${DART_API_KEY:}
  base-url: ${DART_BASE_URL:https://opendart.fss.or.kr}
  backfill-on-start: ${DART_BACKFILL_ON_START:false}
  financial-sync-on-start: ${DART_FINANCIAL_SYNC_ON_START:false}
  # Seven completed years produce multiple leakage-safe t-2..t -> t+1 training rows.
  financial-years-back: ${DART_FINANCIAL_YEARS_BACK:7}
  # Enable once only after a held-out-validated artifact is mounted in the AI server.
  prediction-sync-on-start: ${DART_PREDICTION_SYNC_ON_START:false}

public-finance:
  # Financial Services Commission summary statements supplement missing DART years only.
  service-key: ${DATA_GO_KR_SERVICE_KEY:}
  base-url: ${DATA_GO_KR_FINANCE_BASE_URL:http://apis.data.go.kr/1160100/service/GetFinaStatInfoService_V2}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    issuer: ${JWT_ISSUER:jobpilot-api}
    secret: ${JWT_SECRET:jobpilot-local-development-secret-change-me}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:120}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  email-verification:
    code-expiry-minutes: ${EMAIL_VERIFICATION_CODE_EXPIRY_MINUTES:10}
    resend-cooldown-seconds: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
    max-failed-attempts: ${EMAIL_VERIFICATION_MAX_FAILED_ATTEMPTS:5}
  dev-auth:
    enabled: false
  oauth:
    success-redirect: ${OAUTH_SUCCESS_REDIRECT:https://job-a-dream.site/oauth/callback}
    pending-expiry-minutes: ${OAUTH_PENDING_EXPIRY_MINUTES:10}
  # ai-server(파이썬 크롤러)가 POST /api/v1/job-postings/ingest 호출할 때 쓰는
  # 서버 간 공유 비밀키. InternalApiKeyFilter 참고.
  internal-api-key: ${INTERNAL_API_KEY:}
  ai-server:
    # 스프링이 크롤링을 트리거할 때 부르는 ai-server 주소. AiServerCrawlClient 참고.
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8001}
  sentiment:
    worker:
      enabled: ${APP_SENTIMENT_WORKER_ENABLED:false}
  face-verification:
    # Internal only: the browser never calls this service directly.
    base-url: ${FACE_VERIFICATION_BASE_URL:http://localhost:8000}
  face-reference:
    # Backend writes this private volume; the face service mounts it read-only.
    directory: ${ADMIN_FACE_REFERENCE_DIR:/app/admin_photos}
  # 기업회원이 등록한 채용공고의 sourceUrl(내부 상세페이지 링크)을 만들 때 쓰는 공개 도메인.
  # EmployerJobPostingService 참고.
  public-base-url: ${PUBLIC_BASE_URL:https://job-a-dream.site}

# SaraminDATA: 키는 SARAMIN_ACCESS_KEY 환경변수로만 주입한다.
saramin-data:
  enabled: ${SARAMIN_DATA_ENABLED:false}
  access-key: ${SARAMIN_ACCESS_KEY:}
  base-url: https://oapi.saramin.co.kr/job-search
  job-mid-code: ${SARAMIN_JOB_MID_CODE:2}
  job-type: ${SARAMIN_JOB_TYPE:1,4,11}
  count-per-page: ${SARAMIN_COUNT_PER_PAGE:50}
  max-pages: ${SARAMIN_MAX_PAGES:3}
  crawl-enabled: ${SARAMIN_CRAWL_ENABLED:false}
  crawl-delay-ms: ${SARAMIN_CRAWL_DELAY_MS:500}
  connect-timeout-seconds: 10
  read-timeout-seconds: 20

# 토스 테스트 결제 키
toss:
  secret-key: ${TOSS_SECRET_KEY:}

# Imported postings are analyzed once with GPT-5.6 Luna, then reused for every member match.
# The daily cap is persisted in MySQL, so restarting the server cannot exceed it.
job-requirement-extraction:
  backfill:
    enabled: ${JOB_REQUIREMENT_BACKFILL_ENABLED:true}
    daily-limit: ${JOB_REQUIREMENT_BACKFILL_DAILY_LIMIT:3000}
    request-interval-ms: ${JOB_REQUIREMENT_BACKFILL_REQUEST_INTERVAL_MS:1000}
    # A readiness check every 10 minutes. The MySQL daily cap still permits only 3,000 postings/day.
    cron: "${JOB_REQUIREMENT_BACKFILL_CRON:0 */10 * * * *}"

# Retrains the small local recommendation model after the 06:00 job crawl.
# It starts with rule-based weak labels and switches to bookmark behaviour once
# enough real bookmarks exist.
job-match-learning:
  retrain-cron: "${JOB_MATCH_LEARNING_RETRAIN_CRON:0 20 6 * * *}"

career:
  api:
    key: ${CAREER_API_KEY}

qnet:
  api:
    key: ${QNET_API_KEY:}

work24:
  enabled: ${WORK24_SYNC_ENABLED:true}
  naeil-learning-api-key: ${WORK24_NAEIL_LEARNING_API_KEY:${WORK24_SERVICE_KEY:}}
  sync-cron: "${WORK24_SYNC_CRON:0 15 5 * * *}"

aladin:
  ttb-key: ${ALADIN_TTB_KEY:}

# 국세청 사업자등록정보 진위확인 API (공공데이터포털/data.go.kr) - 기업회원 가입 시
# 사업자번호 진위를 자동 확인한다. 키가 비어있으면 NtsBusinessVerificationClient가
# fail-open으로 "확인 필요" 처리만 하고 가입 자체는 막지 않는다.
nts:
  api:
    key: ${NTS_API_KEY:}

# 기업회원 전용 Passwordless X1280. Server Key는 백엔드 환경변수로만 주입한다.
x1280:
  enabled: ${X1280_ENABLED:false}
  base-url: ${X1280_BASE_URL:http://localhost:11040}
  server-key: ${X1280_SERVER_KEY:}

barun:
  api:
    key: ${BARUN_API_KEY}

# 2026-08-13: 웹푸시(마감임박/추천 공고 알림) - VAPID 키쌍이 비어있으면 WebPushService가
# fail-open으로 발송을 건너뛴다(기존 gemini-api-key 등과 같은 패턴) - 로컬 개발 중 키가
# 없어도 다른 기능엔 영향 없음. 키 발급 방법은 web-push 라이브러리의 generate-key CLI 참고.
push:
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@job-a-dream.site}
  deadline-reminder:
    # 매일 오전 9시(KST) - 찜한 공고 중 마감 D-3/D-1인 것을 찾아 발송한다.
    cron: "${PUSH_DEADLINE_REMINDER_CRON:0 0 9 * * *}"
  recommended-job:
    # 매일 오전 8시 30분(KST) - 크롤러(06:00)/요건추출 백필 이후, 마감임박 알림(09:00) 전에
    # 새로 APPLY_NOW/보완후도전으로 매칭된 공고를 찾아 발송한다. 공고 크롤링·요건 추출이
    # 끝난 뒤 빠르게 알리되, NotificationLog 중복키가 같은 공고의 재발송은 막는다.
    cron: "${PUSH_RECOMMENDED_JOB_CRON:0 */15 * * * *}"
